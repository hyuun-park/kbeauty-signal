name: Daily Reddit Collector

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 오전 9시 (한국시간 = UTC+9, 즉 UTC 00:00)
  workflow_dispatch:       # 수동 실행 버튼도 활성화

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install gspread google-auth

      - name: 수집 실행
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python 00-data-pipeline/reddit_to_sheets.py
